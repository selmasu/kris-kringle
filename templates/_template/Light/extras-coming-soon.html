<!DOCTYPE html>
<html class="count-down-bg">
    <head>
        <meta charset="utf-8" />
        <title>Codefox - Responsive Admin Dashboard Template</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <meta content="A fully featured admin theme which can be used to build CRM, CMS, etc." name="description" />
        <meta content="Coderthemes" name="author" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />

        <!-- App favicon -->
        <link rel="shortcut icon" href="assets/images/favicon.ico">

        <!-- App css -->
        <link href="../plugins/bootstrap-select/css/bootstrap-select.min.css" rel="stylesheet" />
        <link href="assets/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
        <link href="assets/css/core.css" rel="stylesheet" type="text/css" />
        <link href="assets/css/components.css" rel="stylesheet" type="text/css" />
        <link href="assets/css/icons.css" rel="stylesheet" type="text/css" />
        <link href="assets/css/pages.css" rel="stylesheet" type="text/css" />
        <link href="assets/css/menu.css" rel="stylesheet" type="text/css" />
        <link href="assets/css/responsive.css" rel="stylesheet" type="text/css" />

        <script src="assets/js/modernizr.min.js"></script>

    </head>


    <body class="bg-transparent">

        <!-- HOME -->
        <section>
            <div class="container-alt container">
                <div class="row">
                    <div class="col-sm-12 text-center">

                        <div class="home-wrapper">
                            <img src="assets/images/logo_white.png" alt="" height="30" class="m-b-30">
                            <h2 class="text-white text-uppercase m-t-50">Stay tunned, we're launching very soon</h2>


                            <div class="row">
                                <div class="col-sm-10 col-sm-offset-1">
                                    <div id="count-down" class="row center-block">
                                        <div class="clock-presenter days_dash col-sm-3">
                                            <div class="digit"></div>
                                            <div class="digit"></div>
                                            <div class="digit"></div>
                                            <p class='note dash_title'>Days</p>
                                        </div>
                                        <div class="clock-presenter hours_dash col-sm-3">
                                            <div class="digit"></div>
                                            <div class="digit"></div>
                                            <p class='note dash_title'>Hours</p>
                                        </div>
                                        <div class="clock-presenter minutes_dash col-sm-3">
                                            <div class="digit"></div>
                                            <div class="digit"></div>
                                            <p class='note dash_title'>Minutes</p>
                                        </div>
                                        <div class="clock-presenter seconds_dash col-sm-3">
                                            <div class="digit"></div>
                                            <div class="digit"></div>
                                            <p class='note dash_title'>Seconds</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </section>
        <!-- END HOME -->


        <script>
            var resizefunc = [];
        </script>

        <!-- jQuery  -->
        <script src="assets/js/jquery.min.js"></script>
        <script src="assets/js/bootstrap.min.js"></script>
        <script src="assets/js/metisMenu.min.js"></script>
        <script src="assets/js/waves.js"></script>
        <script src="assets/js/jquery.slimscroll.js"></script>
        <script src="../plugins/bootstrap-select/js/bootstrap-select.min.js" type="text/javascript"></script>

        <!-- Count down js -->
        <script src="../plugins/count-down/jquery.lwtCountdown-1.0.js"></script>

        <!-- App js -->
        <script src="assets/js/jquery.core.js"></script>
        <script src="assets/js/jquery.app.js"></script>

        <script type="text/javascript">
            $(document).ready(function () {

                "use strict";

                //Set your date
                $('#count-down').countDown({
                    targetDate: {
                        'day': 22,
                        'month': 7,
                        'year': 2018,
                        'hour': 7,
                        'min': 7,
                        'sec': 7
                    },
                    omitWeeks: true
                });

            });
        </script>

    </body>
</html>
